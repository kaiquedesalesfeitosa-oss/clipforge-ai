<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="gt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#050507"/>
  <ellipse cx="600" cy="200" rx="520" ry="280" fill="url(#glow)"/>
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="none" stroke="#27272a" stroke-width="2"/>
  <!-- logo clapperboard -->
  <g transform="translate(530,120)">
    <rect x="0" y="0" width="140" height="100" rx="16" fill="#7c3aed" fill-opacity="0.25" stroke="#8b5cf6" stroke-width="3"/>
    <path d="M0 30 H140 M0 70 H140" stroke="#8b5cf6" stroke-width="3"/>
    <path d="M0 0 L35 30 M45 0 L80 30 M90 0 L125 30" stroke="#a78bfa" stroke-width="3"/>
  </g>
  <!-- nome do site -->
  <text x="600" y="330" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="96" font-weight="900" fill="url(#gt)">ClipForge AI</text>
  <!-- slogan -->
  <text x="600" y="395" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#a1a1aa">Cortes virais · AI Music + Sound Design · AI B-Roll</text>
  <text x="600" y="450" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="28" font-weight="500" fill="#71717a">Edição com IA de ponta a ponta para criadores</text>
  <!-- selo -->
  <g transform="translate(430,490)">
    <rect width="340" height="48" rx="24" fill="#7c3aed" fill-opacity="0.2" stroke="#8b5cf6" stroke-width="2"/>
    <text x="170" y="31" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#c4b5fd">Pronto para viralizar</text>
  </g>
</svg>
